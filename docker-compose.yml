services:
  tikv-all-in-one:
    build:
      context: .
      dockerfile: Dockerfile.all-in-one
    container_name: tikv-nosql-all-in-one
    restart: unless-stopped
    ports:
      - "2379:2379"
      - "2380:2380"
      - "4000:4000"
      - "10080:10080"
      - "5173:5173"
      - "20161:20161"
      - "20181:20181"
      - "20162:20162"
      - "20182:20182"
      - "20163:20163"
      - "20183:20183"
    volumes:
      - tikv-all-in-one-data:/data

volumes:
  tikv-all-in-one-data:
