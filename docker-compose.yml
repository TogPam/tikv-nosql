services:
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: shoe-store-prometheus
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    depends_on:
      - pd
      - tidb
      - tikv1
      - tikv2

  pd:
    image: pingcap/pd:latest
    container_name: tikv-pd
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
    ports:
      - "2379:2379"
      - "2380:2380"
    volumes:
      - pd-bridge-data:/data
    command:
      - --name=pd
      - --client-urls=http://0.0.0.0:2379
      - --peer-urls=http://0.0.0.0:2380
      - --advertise-client-urls=http://pd:2379
      - --advertise-peer-urls=http://pd:2380
      - --initial-cluster=pd=http://pd:2380
      - --data-dir=/data/pd

  tidb:
    image: pingcap/tidb:latest
    container_name: tikv-tidb
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
    ports:
      - "4000:4000"
      - "10080:10080"
    depends_on:
      - pd
    command:
      - --store=tikv
      - --path=pd:2379

  tikv1:
    image: pingcap/tikv:latest
    container_name: tikv-tikv1
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
    depends_on:
      - pd
    volumes:
      - tikv1-bridge-data:/data
    command:
      - --pd-endpoints=http://pd:2379
      - --addr=0.0.0.0:20160
      - --advertise-addr=tikv1:20160
      - --status-addr=0.0.0.0:20180
      - --advertise-status-addr=tikv1:20180
      - --data-dir=/data/tikv1

  tikv2:
    image: pingcap/tikv:latest
    container_name: tikv-tikv2
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
    depends_on:
      - pd
    volumes:
      - tikv2-bridge-data:/data
    command:
      - --pd-endpoints=http://pd:2379
      - --addr=0.0.0.0:20160
      - --advertise-addr=tikv2:20160
      - --status-addr=0.0.0.0:20180
      - --advertise-status-addr=tikv2:20180
      - --data-dir=/data/tikv2

  backend:
    build:
      context: ./backend
    container_name: shoe-store-backend
    restart: on-failure
    deploy:
      resources:
        limits:
          memory: 768M
    ports:
      - "8080:8080"
    environment:
      TIKV_PD_ENDPOINTS: pd:2379
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=70
    depends_on:
      - pd
      - tikv1
      - tikv2

volumes:
  pd-bridge-data:
  tikv1-bridge-data:
  tikv2-bridge-data:
  prometheus-data:
