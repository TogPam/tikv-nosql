version: '3.8'

services:
  pd:
    image: pingcap/pd:latest
    container_name: tikv-pd
    ports:
      - "2379:2379"  # Client API & PD Dashboard
      - "2380:2380"
    volumes:
      - pd-data:/data
    command:
      - --name=pd
      - --client-urls=http://0.0.0.0:2379
      - --peer-urls=http://0.0.0.0:2380
      - --advertise-client-urls=http://pd:2379,http://127.0.0.1:2379
      - --advertise-peer-urls=http://pd:2380
      - --initial-cluster=pd=http://pd:2380
      - --data-dir=/data/pd
    networks:
      - tikv-net

  tidb:
    image: pingcap/tidb:latest
    container_name: tikv-tidb
    restart: unless-stopped
    depends_on:
      - pd
    ports:
      - "4000:4000"
      - "10080:10080"
    command:
      - --store=tikv
      - --path=pd:2379
    networks:
      - tikv-net

  tikv1:
    image: pingcap/tikv:latest
    container_name: tikv-tikv1
    depends_on:
      - pd
    ports:
      - "20161:20160"
    volumes:
      - tikv1-data:/data
    command:
      - --pd-endpoints=pd:2379
      - --addr=0.0.0.0:20160
      - --advertise-addr=tikv1:20160
      - --data-dir=/data/tikv1
    networks:
      - tikv-net

  tikv2:
    image: pingcap/tikv:latest
    container_name: tikv-tikv2
    depends_on:
      - pd
    ports:
      - "20162:20160"
    volumes:
      - tikv2-data:/data
    command:
      - --pd-endpoints=pd:2379
      - --addr=0.0.0.0:20160
      - --advertise-addr=tikv2:20160
      - --data-dir=/data/tikv2
    networks:
      - tikv-net

  tikv3:
    image: pingcap/tikv:latest
    container_name: tikv-tikv3
    depends_on:
      - pd
    ports:
      - "20163:20160"
    volumes:
      - tikv3-data:/data
    command:
      - --pd-endpoints=pd:2379
      - --addr=0.0.0.0:20160
      - --advertise-addr=tikv3:20160
      - --data-dir=/data/tikv3
    networks:
      - tikv-net

volumes:
  pd-data:
  tikv1-data:
  tikv2-data:
  tikv3-data:

networks:
  tikv-net:
    driver: bridge
